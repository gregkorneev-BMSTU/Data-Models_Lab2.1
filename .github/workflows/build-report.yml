name: Build Word report

on:
  push:
    paths:
      - 'tools/build_report.py'
      - 'assets/bauman_logo.b64'
      - '.github/workflows/build-report.yml'
      - 'screenshots/queries/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install report dependencies
        run: python -m pip install --disable-pip-version-check python-docx Pillow

      - name: Restore university emblem
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          Path('assets/bauman_logo.png').write_bytes(
              base64.b64decode(Path('assets/bauman_logo.b64').read_text())
          )
          PY

      - name: Build report
        run: python tools/build_report.py

      - name: Commit report to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add report/ЛР2_ч1_КорнеевГИ_ИУ5-34Б.docx
          if ! git diff --cached --quiet; then
            git commit -m "Publish Lab 2.1 Word report"
            git push origin HEAD:main
          fi
